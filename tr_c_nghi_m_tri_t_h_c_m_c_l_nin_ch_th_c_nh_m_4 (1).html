<!DOCTYPE html>
<html lang="vi" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trắc Nghiệm Triết Học - Chủ Đề Ý Thức | Nhóm 4</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts Inter & Space Grotesk -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Space Grotesk', 'sans-serif'],
                    },
                    colors: {
                        neon: {
                            cyan: '#00f2fe',
                            purple: '#7928ca',
                            pink: '#ff0080',
                            emerald: '#10b981',
                        }
                    },
                    animation: {
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'glow': 'glow 2s ease-in-out infinite alternate',
                    },
                    keyframes: {
                        glow: {
                            '0%': { boxShadow: '0 0 15px rgba(0, 242, 254, 0.4), 0 0 30px rgba(121, 40, 202, 0.3)' },
                            '100%': { boxShadow: '0 0 30px rgba(0, 242, 254, 0.8), 0 0 60px rgba(255, 0, 128, 0.6)' }
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #080a11;
            color: #f1f5f9;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }
        .font-display {
            font-family: 'Space Grotesk', sans-serif;
        }
        /* Glassmorphism Styles */
        .glass-panel {
            background: rgba(17, 24, 39, 0.65);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .glass-btn {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .glass-btn:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(0, 242, 254, 0.5);
            transform: translateY(-2px);
        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #080a11;
        }
        ::-webkit-scrollbar-thumb {
            background: #1e293b;
            border-radius: 9999px;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between relative selection:bg-rose-500 selection:text-white">

    <!-- CANVAS BACKGROUND EFFECT -->
    <canvas id="bg-canvas" class="fixed inset-0 pointer-events-none z-0 opacity-60"></canvas>

    <!-- HEADER BRANDING -->
    <header class="relative z-10 w-full max-w-5xl mx-auto px-6 pt-6 flex items-center justify-between">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-cyan-500 via-purple-600 to-pink-500 p-[1px] shadow-lg shadow-cyan-500/20">
                <div class="w-full h-full bg-slate-950 rounded-[15px] flex items-center justify-center text-cyan-400">
                    <i class="fa-solid fa-brain text-lg"></i>
                </div>
            </div>
            <div>
                <h1 class="font-display font-bold text-base tracking-wide bg-gradient-to-r from-cyan-400 via-purple-400 to-pink-400 bg-clip-text text-transparent">
                    TRIẾT HỌC MÁC - LÊNIN
                </h1>
                <p class="text-[11px] text-slate-400 font-medium tracking-wider uppercase">Chủ đề: Ý Thức • Bài Tập Nhóm 4</p>
            </div>
        </div>

        <button id="sound-btn" onclick="toggleSound()" class="w-10 h-10 rounded-2xl glass-btn flex items-center justify-center text-slate-300 hover:text-cyan-400">
            <i class="fa-solid fa-volume-high" id="sound-icon"></i>
        </button>
    </header>

    <!-- MAIN CONTAINER -->
    <main class="relative z-10 w-full max-w-3xl mx-auto px-4 py-8 flex-1 flex items-center justify-center">

        <!-- ================= SCREEN 1: START SCREEN (CENTER BUTTON) ================= -->
        <section id="screen-start" class="w-full text-center space-y-10 my-auto py-12">
            <div class="space-y-4 max-w-xl mx-auto">
                <span class="inline-flex items-center px-4 py-1.5 rounded-full text-xs font-semibold tracking-wider uppercase bg-cyan-950/80 text-cyan-400 border border-cyan-500/30 backdrop-blur-md">
                    <i class="fa-solid fa-sparkles mr-2 text-cyan-400"></i>Bài Trắc Nghiệm Tương Tác
                </span>
                <h2 class="text-4xl sm:text-6xl font-display font-extrabold tracking-tight leading-tight text-white">
                    Khám Phá Bản Chất <br>
                    <span class="bg-gradient-to-r from-cyan-400 via-purple-400 to-pink-500 bg-clip-text text-transparent">Của Ý Thức</span>
                </h2>
            </div>

            <!-- CENTER MAIN START BUTTON -->
            <div class="flex justify-center items-center pt-4">
                <button onclick="startQuiz()" class="group relative inline-flex items-center justify-center p-0.5 overflow-hidden text-lg font-bold rounded-3xl transition-all duration-300 hover:scale-105 active:scale-95 shadow-2xl shadow-cyan-500/30">
                    <span class="absolute inset-0 w-full h-full bg-gradient-to-br from-cyan-400 via-purple-600 to-pink-500 group-hover:from-cyan-300 group-hover:to-pink-400"></span>
                    <span class="relative px-12 py-5 bg-slate-950 rounded-[22px] transition-all duration-300 group-hover:bg-opacity-0 flex items-center space-x-3 text-white tracking-wider">
                        <span>BẮT ĐẦU LÀM BÀI</span>
                        <i class="fa-solid fa-arrow-right text-cyan-400 group-hover:text-white transition-transform group-hover:translate-x-1"></i>
                    </span>
                </button>
            </div>
        </section>

        <!-- ================= SCREEN 2: QUIZ INTERFACE ================= -->
        <section id="screen-quiz" class="w-full hidden space-y-6 my-auto">
            <!-- Progress & Stats Header -->
            <div class="glass-panel p-4 rounded-3xl flex items-center justify-between">
                <div class="flex items-center space-x-4">
                    <span class="text-xs font-bold uppercase tracking-wider text-slate-400">Câu <span id="current-question-num" class="text-cyan-400 text-sm">1</span>/10</span>
                    <div class="w-24 sm:w-36 h-2 bg-slate-800 rounded-full overflow-hidden">
                        <div id="progress-bar" class="h-full bg-gradient-to-r from-cyan-400 to-purple-500 transition-all duration-300 w-[10%]"></div>
                    </div>
                </div>
                <div class="flex items-center space-x-4">
                    <div class="flex items-center space-x-1.5 text-amber-400 text-sm font-bold bg-amber-950/40 px-3 py-1 rounded-full border border-amber-500/20">
                        <i class="fa-solid fa-fire text-amber-500"></i>
                        <span id="streak-count">0</span>
                    </div>
                    <div class="flex items-center space-x-1.5 text-cyan-400 text-sm font-bold bg-cyan-950/40 px-3 py-1 rounded-full border border-cyan-500/20">
                        <i class="fa-solid fa-star text-cyan-400"></i>
                        <span id="score-count">0</span>
                    </div>
                </div>
            </div>

            <!-- Question Card -->
            <div class="glass-panel p-6 sm:p-8 rounded-3xl space-y-6 relative overflow-hidden">
                <h3 id="question-text" class="text-lg sm:text-xl font-semibold leading-relaxed text-slate-100">
                    Loading question...
                </h3>

                <!-- Options Grid -->
                <div id="options-container" class="space-y-3">
                    <!-- Dynamic Options Inserted Here -->
                </div>

                <!-- Explanation Box -->
                <div id="explanation-box" class="hidden p-4 rounded-2xl bg-cyan-950/30 border border-cyan-500/30 text-sm text-cyan-200 leading-relaxed">
                    <span class="font-bold text-cyan-400 flex items-center gap-1.5 mb-1">
                        <i class="fa-solid fa-circle-info"></i> Giải thích triết học:
                    </span>
                    <p id="explanation-text"></p>
                </div>
            </div>

            <!-- Quiz Controls -->
            <div class="flex justify-end pt-2">
                <button id="next-btn" onclick="nextQuestion()" disabled class="px-6 py-3 rounded-2xl bg-slate-800 text-slate-500 font-semibold cursor-not-allowed transition-all flex items-center space-x-2">
                    <span>Câu tiếp theo</span>
                    <i class="fa-solid fa-arrow-right"></i>
                </button>
            </div>
        </section>

        <!-- ================= SCREEN 3: RESULTS SCREEN ================= -->
        <section id="screen-result" class="w-full hidden space-y-8 my-auto py-8 text-center">
            <div class="glass-panel p-8 sm:p-10 rounded-3xl space-y-6 relative overflow-hidden max-w-xl mx-auto">
                <div class="w-20 h-20 mx-auto rounded-3xl bg-gradient-to-tr from-cyan-500 to-purple-600 p-[1px] flex items-center justify-center">
                    <div class="w-full h-full bg-slate-950 rounded-[23px] flex items-center justify-center text-3xl text-cyan-400">
                        <i class="fa-solid fa-trophy"></i>
                    </div>
                </div>

                <div>
                    <h3 class="text-2xl font-display font-bold text-white mb-1">Hoàn Thành Bài Thi!</h3>
                    <p id="result-rating" class="text-sm font-medium text-cyan-400">Xuất sắc!</p>
                </div>

                <div class="grid grid-cols-2 gap-4 py-2">
                    <div class="p-4 rounded-2xl bg-slate-900/60 border border-slate-800">
                        <span class="text-xs text-slate-400 uppercase tracking-wider block font-semibold mb-1">Tổng điểm</span>
                        <span id="final-score" class="text-3xl font-display font-bold text-cyan-400">0</span>
                    </div>
                    <div class="p-4 rounded-2xl bg-slate-900/60 border border-slate-800">
                        <span class="text-xs text-slate-400 uppercase tracking-wider block font-semibold mb-1">Số câu đúng</span>
                        <span id="final-correct" class="text-3xl font-display font-bold text-emerald-400">0/10</span>
                    </div>
                </div>

                <button onclick="resetQuiz()" class="w-full py-4 rounded-2xl bg-gradient-to-r from-cyan-500 to-purple-600 text-white font-bold tracking-wider hover:opacity-90 transition-all shadow-lg shadow-cyan-500/25 flex items-center justify-center space-x-2">
                    <i class="fa-solid fa-rotate-right"></i>
                    <span>LÀM BÀI LẠI</span>
                </button>
            </div>
        </section>
    </main>

    <!-- FOOTER -->
    <footer class="relative z-10 w-full max-w-5xl mx-auto px-6 py-4 text-center text-xs text-slate-500">
        © 2026 Nhóm 4 • Môn Triết Học Mác - Lênin
    </footer>

    <!-- SCRIPT LOGIC -->
    <script>
        // Questions Data
        const questions = [
            {
                question: "1. Theo chủ nghĩa duy vật biện chứng, nguồn gốc tự nhiên của ý thức bao gồm những yếu tố nào?",
                options: [
                    "Bộ óc con người và lao động sản xuất.",
                    "Bộ óc con người và sự tác động của thế giới khách quan lên bộ óc.",
                    "Lao động sản xuất và hệ thống ngôn ngữ.",
                    "Ngôn ngữ và sự tác động của thế giới khách quan."
                ],
                correct: 1,
                explanation: "Nguồn gốc tự nhiên của ý thức bao gồm bộ óc con người (cơ quan phản ánh) và sự tác động của thế giới khách quan lên bộ óc người."
            },
            {
                question: "2. Yếu tố nào đóng vai trò là nguồn gốc xã hội trực tiếp và quyết định nhất đến sự hình thành, phát triển của ý thức?",
                options: [
                    "Lao động của con người.",
                    "Bộ óc con người.",
                    "Ngôn ngữ.",
                    "Thế giới khách quan."
                ],
                correct: 0,
                explanation: "Thực tiễn lao động giúp con người cải tạo thế giới, buộc thế giới bộc lộ các quy luật để bộ óc nhận thức, là nguồn gốc xã hội trực tiếp nhất."
            },
            {
                question: "3. Luận điểm nào sau đây thể hiện đúng nhất bản chất của ý thức theo triết học Mác - Lênin?",
                options: [
                    "Ý thức là thực thể độc lập tồn tại trước vật chất.",
                    "Ý thức là sự phản ánh thụ động, máy móc hiện thực khách quan.",
                    "Ý thức là sự phản ánh năng động, sáng tạo hiện thực khách quan vào bộ óc con người.",
                    "Ý thức là thuộc tính phổ biến của mọi dạng vật chất."
                ],
                correct: 2,
                explanation: "Bản chất của ý thức là sự phản ánh năng động, sáng tạo hiện thực khách quan vào bộ óc con người."
            },
            {
                question: "4. Khái niệm 'hình ảnh chủ quan của thế giới khách quan' khi nói về ý thức được hiểu như thế nào?",
                options: [
                    "Ý thức do cảm giác chủ quan tự sinh ra.",
                    "Nội dung phản ánh là thế giới khách quan, nhưng hình thức phản ánh bị chi phối bởi chủ thể.",
                    "Ý thức hoàn toàn giống hệt với các đối tượng vật chất trong thực tế.",
                    "Ý thức không có mối liên hệ nào với thế giới khách quan."
                ],
                correct: 1,
                explanation: "Ý thức phản ánh nội dung khách quan bên ngoài, nhưng biểu hiện thông qua lăng kính, tri thức và thế giới nội tâm chủ quan của chủ thể."
            },
            {
                question: "5. Trong kết cấu của ý thức theo các yếu tố hợp thành, yếu tố nào đóng vai trò là hạt nhân cơ bản nhất?",
                options: [
                    "Tình cảm.",
                    "Tri thức.",
                    "Niềm tin.",
                    "Ý chí."
                ],
                correct: 1,
                explanation: "Tri thức là kết quả của quá trình nhận thức, là phương thức tồn tại và là hạt nhân cốt lõi của ý thức."
            },
            {
                question: "6. Khi xem xét kết cấu của ý thức theo chiều sâu tâm lý (cấp độ), ý thức bao gồm những yếu tố nào?",
                options: [
                    "Cảm giác, tri giác, biểu tượng.",
                    "Khái niệm, phán đoán, suy luận.",
                    "Tự ý thức, tiềm thức, vô thức.",
                    "Tri thức, tình cảm, ý chí."
                ],
                correct: 2,
                explanation: "Theo chiều sâu tâm lý, ý thức bao gồm tự ý thức, tiềm thức và vô thức."
            },
            {
                question: "7. Quan điểm nào giải thích đúng về bản chất của 'Trí tuệ nhân tạo' (AI) so với ý thức con người?",
                options: [
                    "AI có khả năng sáng tạo tinh thần độc lập hoàn toàn như bộ óc con người.",
                    "AI chỉ là quá trình vật lý - kỹ thuật được lập trình, không có bản chất xã hội và khả năng sáng tạo tinh thần như ý thức người.",
                    "AI sẽ hoàn toàn thay thế và tiêu diệt ý thức con người trong tương lai.",
                    "AI có tâm lý và cảm xúc giống hệt con người."
                ],
                correct: 1,
                explanation: "AI là hệ thống kỹ thuật do con người lập trình phỏng theo một số thao tác tư duy, hoàn toàn không có bản chất xã hội và sáng tạo tinh thần tự thân."
            },
            {
                question: "8. Những trạng thái tâm lý ở chiều sâu, nảy sinh bên ngoài sự kiểm soát trực tiếp của ý thức được gọi là gì?",
                options: [
                    "Tự ý thức.",
                    "Tiềm thức.",
                    "Vô thức.",
                    "Tri thức."
                ],
                correct: 2,
                explanation: "Vô thức là hiện tượng tâm lý ở chiều sâu, nảy sinh bên ngoài sự kiểm soát trực tiếp của ý thức."
            },
            {
                question: "9. Bệnh 'chủ quan duy ý chí' trong hoạt động thực tiễn xuất phát từ sai lầm nào?",
                options: [
                    "Tuyệt đối hóa vai trò của vật chất, thụ động ỷ lại.",
                    "Tuyệt đối hóa vai trò, tính chủ quan của ý thức và coi nhẹ quy luật khách quan.",
                    "Tôn trọng và hành động theo quy luật khách quan.",
                    "Đánh giá chính xác khả năng thực tế của con người."
                ],
                correct: 1,
                explanation: "Bệnh chủ quan duy ý chí sinh ra do tuyệt đối hóa vai trò ý chí chủ quan, xa rời thực tiễn và coi nhẹ các quy luật khách quan."
            },
            {
                question: "10. Sự khác biệt căn bản giữa quan niệm duy vật biện chứng và duy vật siêu hình về nguồn gốc ý thức là gì?",
                options: [
                    "CNDV siêu hình đồng nhất ý thức với vật chất, còn CNDVBC khẳng định ý thức là chức năng của bộ óc người và nhấn mạnh nguồn gốc xã hội.",
                    "CNDV siêu hình cho rằng ý thức do thần linh tạo ra.",
                    "CNDV biện chứng cho rằng ý thức tồn tại trước và sinh ra thế giới vật chất.",
                    "Cả hai trường phái đều coi ngôn ngữ là nguồn gốc quyết định duy nhất."
                ],
                correct: 0,
                explanation: "CNDV siêu hình coi ý thức như một dạng vật chất đặc biệt hoặc thuộc tính của mọi vật chất, trong khi CNDVBC khẳng định ý thức là thuộc tính của riêng bộ óc người và nhấn mạnh nguồn gốc xã hội."
            }
        ];

        let currentQuestion = 0;
        let score = 0;
        let streak = 0;
        let correctAnswers = 0;
        let soundEnabled = true;

        // Background Canvas Animation
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.vx = (Math.random() - 0.5) * 0.8;
                this.vy = (Math.random() - 0.5) * 0.8;
                this.radius = Math.random() * 2 + 1;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
                if (this.y < 0 || this.y > canvas.height) this.vy *= -1;
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(0, 242, 254, 0.4)';
                ctx.fill();
            }
        }

        for (let i = 0; i < 45; i++) particles.push(new Particle());

        function animateCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animateCanvas);
        }
        animateCanvas();

        // Quiz Logic
        function startQuiz() {
            document.getElementById('screen-start').classList.add('hidden');
            document.getElementById('screen-quiz').classList.remove('hidden');
            currentQuestion = 0;
            score = 0;
            streak = 0;
            correctAnswers = 0;
            updateStats();
            loadQuestion();
        }

        function loadQuestion() {
            const q = questions[currentQuestion];
            document.getElementById('current-question-num').innerText = currentQuestion + 1;
            document.getElementById('progress-bar').style.width = `${((currentQuestion + 1) / questions.length) * 100}%`;
            document.getElementById('question-text').innerText = q.question;

            const container = document.getElementById('options-container');
            container.innerHTML = '';

            const explanationBox = document.getElementById('explanation-box');
            explanationBox.classList.add('hidden');

            const nextBtn = document.getElementById('next-btn');
            nextBtn.disabled = true;
            nextBtn.className = "px-6 py-3 rounded-2xl bg-slate-800 text-slate-500 font-semibold cursor-not-allowed transition-all flex items-center space-x-2";

            q.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = "w-full p-4 rounded-2xl glass-btn text-left text-sm text-slate-200 transition-all flex items-center justify-between group";
                btn.onclick = () => selectAnswer(idx);
                btn.innerHTML = `
                    <span>${opt}</span>
                    <i class="fa-regular fa-circle text-slate-500 group-hover:text-cyan-400"></i>
                `;
                container.appendChild(btn);
            });
        }

        function selectAnswer(selectedIndex) {
            const q = questions[currentQuestion];
            const container = document.getElementById('options-container');
            const buttons = container.children;

            Array.from(buttons).forEach(btn => btn.disabled = true);

            if (selectedIndex === q.correct) {
                buttons[selectedIndex].className = "w-full p-4 rounded-2xl bg-emerald-950/60 border border-emerald-500/50 text-left text-sm text-emerald-200 transition-all flex items-center justify-between";
                buttons[selectedIndex].querySelector('i').className = "fa-solid fa-circle-check text-emerald-400 text-base";
                score += 10;
                streak += 1;
                correctAnswers += 1;
            } else {
                buttons[selectedIndex].className = "w-full p-4 rounded-2xl bg-rose-950/60 border border-rose-500/50 text-left text-sm text-rose-200 transition-all flex items-center justify-between";
                buttons[selectedIndex].querySelector('i').className = "fa-solid fa-circle-xmark text-rose-400 text-base";
                buttons[q.correct].className = "w-full p-4 rounded-2xl bg-emerald-950/60 border border-emerald-500/50 text-left text-sm text-emerald-200 transition-all flex items-center justify-between";
                buttons[q.correct].querySelector('i').className = "fa-solid fa-circle-check text-emerald-400 text-base";
                streak = 0;
            }

            updateStats();

            document.getElementById('explanation-text').innerText = q.explanation;
            document.getElementById('explanation-box').classList.remove('hidden');

            const nextBtn = document.getElementById('next-btn');
            nextBtn.disabled = false;
            nextBtn.className = "px-6 py-3 rounded-2xl bg-gradient-to-r from-cyan-500 to-purple-600 text-white font-semibold hover:opacity-90 transition-all shadow-lg shadow-cyan-500/20 flex items-center space-x-2 cursor-pointer";
        }

        function updateStats() {
            document.getElementById('score-count').innerText = score;
            document.getElementById('streak-count').innerText = streak;
        }

        function nextQuestion() {
            currentQuestion++;
            if (currentQuestion < questions.length) {
                loadQuestion();
            } else {
                showResults();
            }
        }

        function showResults() {
            document.getElementById('screen-quiz').classList.add('hidden');
            document.getElementById('screen-result').classList.remove('hidden');

            document.getElementById('final-score').innerText = score;
            document.getElementById('final-correct').innerText = `${correctAnswers}/${questions.length}`;

            let rating = "Xuất sắc!";
            if (correctAnswers < 5) rating = "Cần ôn tập thêm!";
            else if (correctAnswers < 8) rating = "Khá tốt!";

            document.getElementById('result-rating').innerText = rating;
        }

        function resetQuiz() {
            document.getElementById('screen-result').classList.add('hidden');
            startQuiz();
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            const icon = document.getElementById('sound-icon');
            icon.className = soundEnabled ? "fa-solid fa-volume-high" : "fa-solid fa-volume-xmark";
        }
    </script>
</body>
</html>
